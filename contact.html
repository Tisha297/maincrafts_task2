<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <h2>✨ MySpace</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

    </nav>


    <!-- Contact Section -->
    <section class="contact">

        <div class="contact-info">

            <p class="small-heading">GET IN TOUCH</p>

            <h1>Let's have a chat! 💬</h1>

            <p>
                Have an idea, question or just want to say hello?
                Feel free to send me a message.
            </p>

            <div class="contact-item">
                📧
                <span>Let's connect through email</span>
            </div>

            <div class="contact-item">
                💡
                <span>I'm always happy to learn something new</span>
            </div>

        </div>


        <!-- Contact Form -->
        <div class="form-box">

            <h2>Send a Message</h2>

            <form name="contactForm" onsubmit="return validateForm()">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                >


                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                >


                <label>Message</label>

                <textarea
                    name="message"
                    placeholder="Write your message..."
                ></textarea>


                <button type="submit">
                    Send Message 🚀
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MySpace | Made while learning 💜
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
